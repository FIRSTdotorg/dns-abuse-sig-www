name: Validate matrix sources

# Publication is paused until an editable build reproduces the v1.3 layout.
# Future publication must open a pull request, never push to the default branch.
on:
  pull_request:
    paths:
      - 'matrix/**'
      - 'Makefile'
      - '.github/workflows/latest-pdf.yml'
      - 'DNS-Abuse-Techniques-Matrix_v1-latest.pdf'
      - 'DNS-Abuse-Techniques-Matrix_v1.3.pdf'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: make validate
      - name: Check the restored v1.3 baseline
        run: cmp DNS-Abuse-Techniques-Matrix_v1.3.pdf DNS-Abuse-Techniques-Matrix_v1-latest.pdf
